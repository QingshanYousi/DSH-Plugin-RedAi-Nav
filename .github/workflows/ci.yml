# 三道门禁：产物与源码一致、数据与产物一致、离线断言全绿。
# 这里不装任何依赖——包里本来就没有 dependencies，装了反而说明有人加了东西。
name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 确认没有第三方依赖
        run: |
          node -e "const p=require('./package.json');const d={...p.dependencies,...p.devDependencies};if(Object.keys(d).length){console.error('unexpected dependencies:',d);process.exit(1)}"

      - name: 产物必须与 src/ 同步（改了源码却没 build 会红）
        run: node scripts/build.mjs --check

      - name: 排行榜数据必须自洽（schema / 排序 / rank 连续，全程离线）
        run: node scripts/build-ranking.mjs --offline

      - name: 内联数据必须与 data/*.json 同步（改了数据却没跑 data 会红）
        run: node scripts/embed-data.mjs --check

      - name: 语法与离线断言
        run: |
          node --check lib/client.js
          npm test

      - name: 出网必须申报（不禁止联网，禁止未申报的联网）
        run: |
          node -e "
            const pkg = require('./package.json')
            const declared = (pkg.dsh && pkg.dsh.disclosure && pkg.dsh.disclosure.network) || []
            const source = require('fs').readFileSync('lib/client.js', 'utf8')
            const code = source.replace(/\/\*[\s\S]*?\*\//g, '').replace(/^\s*\/\/.*$/gm, '')
            const hit = code.match(/fetch\s*\(|XMLHttpRequest|sendBeacon/)
            if (hit && declared.length === 0) {
              console.error('::error::lib/client.js calls the network (' + hit[0] + ') but dsh.disclosure.network is empty')
              process.exit(1)
            }
            if (!hit && declared.length > 0) {
              console.error('::error::disclosure.network lists hosts but the bundle never calls them — stale disclosure')
              process.exit(1)
            }
            console.log('network gate ok: code calls=' + (hit ? hit[0] : 'none') + ', declared=' + JSON.stringify(declared))
          "

      - name: npm 包不得包含 src/ 与 scripts/
        run: |
          if npm pack --dry-run 2>&1 | grep -E "^npm notice [0-9.]+[kMG]?B (src|scripts|test)/"; then
            echo "::error::source directories leaked into the published package"; exit 1
          fi
